<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        
        /* Utility classes for hiding elements */
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <i data-lucide="book" class="w-6 h-6"></i> VocabMaster
            </h1>
            <nav class="flex flex-wrap justify-center gap-2 bg-slate-100 p-1 rounded-lg" id="nav-tabs">
                </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8" id="main-content">
        </main>
    
    <footer class="text-center py-6 text-slate-400 text-sm">
        Học mỗi ngày để nâng cao vốn từ vựng của bạn!
    </footer>

    <script>
        // --- DATA ---
        const vocabularyData = [
            { id: 1, word: "Carry on", meaning: "Tiếp tục", type: "phrasal verb", example: "Please carry on with your work." },
            { id: 2, word: "Purse", meaning: "Cái ví", type: "noun", example: "She left her purse at home." },
            { id: 3, word: "Pests", meaning: "Sâu bệnh", type: "noun", example: "Farmers use sprays to kill pests." },
            { id: 4, word: "Paws", meaning: "Bàn chân (động vật)", type: "noun", example: "The cat licked its paws." },
            { id: 5, word: "Toes", meaning: "Ngón chân", type: "noun", example: "He stepped on my toes." },
            { id: 6, word: "Whiskers", meaning: "Râu (động vật)", type: "noun", example: "The cat has long whiskers." },
            { id: 7, word: "Tongue", meaning: "Lưỡi", type: "noun", example: "The dog was panting with its tongue out." },
            { id: 8, word: "Envy", meaning: "Ghen tị", type: "verb", example: "I envy your success." },
            { id: 9, word: "Variety", meaning: "Đa dạng", type: "noun", example: "We need more variety in our diet." },
            { id: 10, word: "Beneficial", meaning: "Có ích, có lợi", type: "adj", example: "Exercise is beneficial to health." },
            { id: 11, word: "Domestic", meaning: "Trong gia đình, quốc nội", type: "adj", example: "They took a domestic flight." },
            { id: 12, word: "Partnership", meaning: "Sự hợp tác", type: "noun", example: "They work in close partnership." },
            { id: 13, word: "Illegal", meaning: "Vi phạm pháp luật", type: "adj", example: "It is illegal to park here." },
            { id: 14, word: "Leash", meaning: "Dây xích", type: "noun", example: "Keep your dog on a leash." },
            { id: 15, word: "Medical conditions", meaning: "Điều kiện về y tế", type: "noun phrase", example: "He has some underlying medical conditions." },
            { id: 16, word: "Melted", meaning: "Tan chảy", type: "adj", example: "The melted snow turned into water." },
            { id: 17, word: "Pay rent", meaning: "Trả tiền thuê nhà", type: "phrase", example: "I have to pay rent every month." },
            { id: 18, word: "Furniture", meaning: "Nội thất", type: "noun", example: "We need to buy new furniture." },
            { id: 19, word: "Gas stove", meaning: "Bếp ga", type: "noun", example: "She cooks on a gas stove." },
            { id: 20, word: "Water pipe", meaning: "Ống nước", type: "noun", example: "The water pipe is leaking." },
            { id: 21, word: "Electrician", meaning: "Thợ sửa điện", type: "noun", example: "Call an electrician to fix the wiring." },
            { id: 22, word: "Plumber", meaning: "Thợ sửa ống nước", type: "noun", example: "The plumber fixed the sink." },
            { id: 23, word: "Socket", meaning: "Ổ cắm điện", type: "noun", example: "Plug the charger into the socket." },
            { id: 24, word: "Sparking", meaning: "Phát ra tia lửa", type: "verb", example: "The broken wire is sparking." },
            { id: 25, word: "Frame", meaning: "Khung", type: "noun", example: "He put the picture in a wooden frame." },
            { id: 26, word: "Scratches", meaning: "Vết xước", type: "noun", example: "There are scratches on my phone screen." },
            { id: 27, word: "Opportunity", meaning: "Cơ hội", type: "noun", example: "This is a great opportunity for you." },
            { id: 28, word: "Bungalow", meaning: "Nhà 1 lầu", type: "noun", example: "They live in a beautiful bungalow." },
            { id: 29, word: "Detached house", meaning: "Nhà riêng biệt", type: "noun", example: "A detached house offers more privacy." },
            { id: 30, word: "Terraced house", meaning: "Nhà liền kề", type: "noun", example: "They bought a terraced house in the city." },
            { id: 31, word: "Cottage", meaning: "Nhà bé bé xinh xinh", type: "noun", example: "We stayed in a lovely country cottage." },
            { id: 32, word: "Semi-detached house", meaning: "Một nửa nhà sát vách", type: "noun", example: "She lives in a semi-detached house." },
            { id: 33, word: "Tidy", meaning: "Dọn dẹp", type: "verb", example: "Please tidy your room." },
            { id: 34, word: "Microwave", meaning: "Lò vi sóng", type: "noun", example: "Heat the soup in the microwave." }
        ];

        // --- GLOBAL STATE ---
        let activeTab = 'list';
        let selectedWordIds = vocabularyData.map(w => w.id);
        
        const tabs = [
            { id: 'list', icon: 'list', label: 'Danh sách' },
            { id: 'flashcard', icon: 'brain', label: 'Flashcard' },
            { id: 'quiz', icon: 'trophy', label: 'Trắc nghiệm' },
            { id: 'write', icon: 'pen-tool', label: 'Luyện viết' }
        ];

        // --- UTILS ---
        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        };

        const getStudyData = () => vocabularyData.filter(w => selectedWordIds.includes(w.id));
        
        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        // --- RENDER APP ---
        function renderNav() {
            const navContainer = document.getElementById('nav-tabs');
            navContainer.innerHTML = tabs.map(tab => `
                <button
                    onclick="switchTab('${tab.id}')"
                    class="px-3 py-2 rounded-md text-sm font-medium transition-all flex items-center gap-2 ${
                        activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
                    }"
                >
                    <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">${tab.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderNav();
            renderMainContent();
        }

        function renderMainContent() {
            const container = document.getElementById('main-content');
            container.innerHTML = ''; 

            if (activeTab === 'list') renderListView(container);
            if (activeTab === 'flashcard') renderFlashcardView(container);
            if (activeTab === 'quiz') renderQuizView(container);
            if (activeTab === 'write') renderWritingView(container);

            lucide.createIcons();
        }

        // --- 1. LIST VIEW ---
        function renderListView(container) {
            const listHTML = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 class="text-xl font-semibold text-slate-700">Danh sách từ vựng</h2>
                            <p class="text-sm text-slate-500">Đã chọn: <span class="font-bold text-indigo-600">${selectedWordIds.length}</span> / ${vocabularyData.length} từ</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="selectAll()" class="px-3 py-1.5 text-sm font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md transition-colors">Chọn tất cả</button>
                            <button onclick="deselectAll()" class="px-3 py-1.5 text-sm font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md transition-colors">Bỏ chọn hết</button>
                        </div>
                    </div>
                    <div class="grid gap-4 sm:grid-cols-2">
                        ${vocabularyData.map(item => {
                            const isSelected = selectedWordIds.includes(item.id);
                            return `
                                <div 
                                    onclick="toggleWord(${item.id})"
                                    class="bg-white p-5 rounded-xl shadow-sm border-2 cursor-pointer transition-all group ${isSelected ? 'border-indigo-400 bg-indigo-50/30' : 'border-slate-100 hover:border-indigo-200'}"
                                >
                                    <div class="flex justify-between items-start">
                                        <div class="flex gap-3 items-start">
                                            <div class="mt-1 w-5 h-5 rounded border flex items-center justify-center flex-shrink-0 transition-colors ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300'}">
                                                ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                                            </div>
                                            <div>
                                                <h3 class="text-lg font-bold ${isSelected ? 'text-indigo-700' : 'text-slate-700'}">${item.word}</h3>
                                                <span class="text-xs font-mono text-slate-400 bg-white px-2 py-0.5 rounded-full border border-slate-100">${item.type}</span>
                                            </div>
                                        </div>
                                        <button 
                                            onclick="event.stopPropagation(); speak('${item.word.replace(/'/g, "\\'")}')"
                                            class="text-slate-400 hover:text-indigo-500 transition-colors p-1 rounded-full hover:bg-indigo-100"
                                            title="Nghe phát âm"
                                        >
                                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                    <div class="pl-8">
                                        <p class="mt-2 text-slate-800 font-medium">${item.meaning}</p>
                                        <p class="mt-2 text-sm text-slate-500 italic border-l-2 border-indigo-100 pl-2">"${item.example}"</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = listHTML;
        }

        window.toggleWord = (id) => {
            if (selectedWordIds.includes(id)) {
                selectedWordIds = selectedWordIds.filter(i => i !== id);
            } else {
                selectedWordIds.push(id);
            }
            renderMainContent();
        };

        window.selectAll = () => {
            selectedWordIds = vocabularyData.map(w => w.id);
            renderMainContent();
        };

        window.deselectAll = () => {
            selectedWordIds = [];
            renderMainContent();
        };

        // --- 2. FLASHCARD VIEW ---
        let fcData = [];
        let fcIndex = 0;
        let fcFlipped = false;

        function renderFlashcardView(container) {
            fcData = getStudyData();
            if (fcData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-500">
                        <i data-lucide="book" class="w-16 h-16 mb-4 text-slate-300"></i>
                        <p class="text-lg font-medium">Bạn chưa chọn từ vựng nào.</p>
                        <p class="text-sm mt-2">Vui lòng quay lại tab Danh sách để tích chọn từ cần học.</p>
                    </div>`;
                return;
            }

            // Fix index if bounds changed
            if (fcIndex >= fcData.length) fcIndex = 0;
            const currentCard = fcData[fcIndex];

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh]">
                    <div class="w-full max-w-md mb-6 flex justify-between items-center text-sm text-slate-500">
                        <span class="font-medium">Thẻ ${fcIndex + 1} / ${fcData.length}</span>
                        <div class="flex items-center gap-3">
                            <button onclick="fcShuffle()" class="flex items-center gap-1 text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 px-2 py-1 rounded transition-colors" title="Xáo trộn thứ tự thẻ">
                                <i data-lucide="shuffle" class="w-4 h-4"></i> Xáo trộn
                            </button>
                            <span class="hidden sm:inline text-xs bg-slate-100 px-2 py-1 rounded">Space để lật</span>
                        </div>
                    </div>

                    <div class="relative w-full max-w-md h-80 cursor-pointer perspective-1000 group" onclick="fcToggleFlip()">
                        <div id="fc-card-inner" class="relative w-full h-full duration-500 preserve-3d transition-transform ${fcFlipped ? 'rotate-y-180' : ''}">
                            <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl shadow-xl border-2 border-indigo-50 flex flex-col items-center justify-center p-8 text-center hover:border-indigo-200 transition-colors">
                                <span class="absolute top-4 right-4 text-xs font-bold text-indigo-400 uppercase tracking-wider">Tiếng Anh</span>
                                <h2 class="text-4xl font-bold text-indigo-700 mb-4">${currentCard.word}</h2>
                                <div onclick="event.stopPropagation(); speak('${currentCard.word.replace(/'/g, "\\'")}')" class="mt-4 p-3 bg-indigo-50 rounded-full text-indigo-600 hover:bg-indigo-100 transition-colors">
                                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                                </div>
                                <p class="mt-8 text-slate-400 text-sm">Nhấn để xem nghĩa</p>
                            </div>

                            <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-indigo-600 rounded-2xl shadow-xl flex flex-col items-center justify-center p-8 text-center text-white">
                                <span class="absolute top-4 right-4 text-xs font-bold text-indigo-200 uppercase tracking-wider">Tiếng Việt</span>
                                <h2 class="text-3xl font-bold mb-2">${currentCard.meaning}</h2>
                                <p class="text-indigo-200 font-mono text-sm mb-6">(${currentCard.type})</p>
                                <div class="bg-white/10 p-4 rounded-lg backdrop-blur-sm">
                                    <p class="italic text-lg">"${currentCard.example}"</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4 mt-8">
                        <button onclick="fcPrev()" class="p-3 rounded-full bg-white shadow-md text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all active:scale-95">
                            <i data-lucide="chevron-left" class="w-6 h-6"></i>
                        </button>
                        <button onclick="fcToggleFlip()" class="px-6 py-3 rounded-full bg-indigo-600 shadow-md text-white font-medium hover:bg-indigo-700 transition-all active:scale-95 flex items-center gap-2">
                            <i data-lucide="rotate-cw" class="w-5 h-5"></i> Lật thẻ
                        </button>
                        <button onclick="fcNext()" class="p-3 rounded-full bg-white shadow-md text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all active:scale-95">
                            <i data-lucide="chevron-right" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        window.fcToggleFlip = () => {
            fcFlipped = !fcFlipped;
            const cardInner = document.getElementById('fc-card-inner');
            if(cardInner) {
                fcFlipped ? cardInner.classList.add('rotate-y-180') : cardInner.classList.remove('rotate-y-180');
            }
        };

        window.fcNext = () => {
            fcFlipped = false;
            setTimeout(() => {
                fcIndex = (fcIndex + 1) % fcData.length;
                renderMainContent();
            }, 150);
        };

        window.fcPrev = () => {
            fcFlipped = false;
            setTimeout(() => {
                fcIndex = (fcIndex - 1 + fcData.length) % fcData.length;
                renderMainContent();
            }, 150);
        };

        window.fcShuffle = () => {
            fcData = shuffleArray(fcData);
            fcIndex = 0;
            fcFlipped = false;
            renderMainContent();
        };

        // --- 3. QUIZ VIEW ---
        let qzData = [];
        let qzIndex = 0;
        let qzScore = 0;
        let qzShowScore = false;
        let qzOptions = [];
        let qzSelected = null;

        function renderQuizView(container) {
            let studyData = getStudyData();
            if (studyData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-500">
                        <i data-lucide="trophy" class="w-16 h-16 mb-4 text-slate-300"></i>
                        <p class="text-lg font-medium">Bạn chưa chọn từ vựng nào.</p>
                        <p class="text-sm mt-2">Vui lòng quay lại tab Danh sách để tích chọn từ làm trắc nghiệm.</p>
                    </div>`;
                return;
            }

            // Initialize Quiz Data if empty or switching back
            if(qzData.length === 0 || qzData.length !== studyData.length) {
                qzData = [...studyData];
                qzIndex = 0;
                qzScore = 0;
                qzShowScore = false;
                qzSelected = null;
            }

            if (qzShowScore) {
                const percentage = (qzScore / qzData.length) * 100;
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-8 bg-white rounded-2xl shadow-sm border border-slate-100 text-center">
                        <i data-lucide="trophy" class="w-16 h-16 text-yellow-400 mb-4"></i>
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Hoàn thành!</h2>
                        <p class="text-slate-600 mb-6">Bạn đã trả lời đúng <span class="text-indigo-600 font-bold text-xl">${qzScore}</span> / ${qzData.length} câu hỏi.</p>
                        <div class="w-full bg-slate-100 rounded-full h-4 mb-8 overflow-hidden">
                            <div class="bg-indigo-500 h-4 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="qzRestart()" class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-600 rounded-lg font-medium hover:bg-slate-50 transition-colors flex items-center gap-2">
                                <i data-lucide="rotate-cw" class="w-4 h-4"></i> Làm lại
                            </button>
                            <button onclick="qzShuffle()" class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors flex items-center gap-2">
                                <i data-lucide="shuffle" class="w-4 h-4"></i> Xáo trộn & Làm mới
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const currentWord = qzData[qzIndex];
            
            // Generate options only if not already generated for current question
            if(!qzSelected && qzOptions.length === 0) {
                const distractors = vocabularyData
                    .filter(item => item.id !== currentWord.id)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3);
                qzOptions = shuffleArray([currentWord, ...distractors]);
            }

            container.innerHTML = `
                <div class="max-w-xl mx-auto">
                    <div class="mb-6 flex justify-between items-center text-sm font-medium text-slate-500">
                        <span>Câu hỏi ${qzIndex + 1}/${qzData.length}</span>
                        <div class="flex items-center gap-4">
                            <button onclick="qzShuffle()" class="flex items-center gap-1 text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 px-2 py-1 rounded transition-colors" title="Xáo trộn câu hỏi và làm lại từ đầu">
                                <i data-lucide="shuffle" class="w-4 h-4"></i> <span class="hidden sm:inline">Xáo trộn</span>
                            </button>
                            <span>Điểm: ${qzScore}</span>
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-2xl shadow-lg border-b-4 border-indigo-100 mb-6 text-center">
                        <h3 class="text-slate-500 text-sm uppercase tracking-wider mb-2">Từ vựng này nghĩa là gì?</h3>
                        <h2 class="text-3xl font-bold text-indigo-700 mb-4 flex items-center justify-center gap-2">
                            ${currentWord.word}
                            <button onclick="speak('${currentWord.word.replace(/'/g, "\\'")}')" class="text-indigo-300 hover:text-indigo-500"><i data-lucide="volume-2" class="w-6 h-6"></i></button>
                        </h2>
                    </div>

                    <div class="grid gap-3">
                        ${qzOptions.map(option => {
                            let btnClass = "bg-white hover:bg-slate-50 border-slate-200 text-slate-700";
                            let iconHTML = '';

                            if (qzSelected) {
                                if (option.id === currentWord.id) {
                                    btnClass = "bg-green-100 border-green-300 text-green-800";
                                    iconHTML = '<i data-lucide="check" class="w-5 h-5 text-green-600"></i>';
                                } else if (qzSelected.id === option.id) {
                                    btnClass = "bg-red-100 border-red-300 text-red-800";
                                    iconHTML = '<i data-lucide="x" class="w-5 h-5 text-red-600"></i>';
                                } else {
                                    btnClass = "bg-slate-50 border-slate-100 text-slate-300";
                                }
                            }

                            return `
                                <button
                                    ${qzSelected ? 'disabled' : ''}
                                    onclick="qzHandleAnswer(${option.id})"
                                    class="w-full p-4 rounded-xl border-2 text-left font-medium transition-all transform active:scale-[0.99] flex justify-between items-center ${btnClass}"
                                >
                                    <span>${option.meaning}</span>
                                    ${iconHTML}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        window.qzHandleAnswer = (optionId) => {
            if (qzSelected) return;
            
            const currentWord = qzData[qzIndex];
            qzSelected = qzOptions.find(o => o.id === optionId);
            
            if (qzSelected.id === currentWord.id) {
                qzScore++;
                speak("Correct");
            } else {
                speak("Wrong");
            }

            renderMainContent(); // Update UI to show colors

            setTimeout(() => {
                qzIndex++;
                qzOptions = []; // Reset options for next question
                qzSelected = null;
                
                if (qzIndex >= qzData.length) {
                    qzShowScore = true;
                }
                renderMainContent();
            }, 1500);
        };

        window.qzRestart = () => {
            qzScore = 0;
            qzIndex = 0;
            qzShowScore = false;
            qzOptions = [];
            qzSelected = null;
            renderMainContent();
        };

        window.qzShuffle = () => {
            qzData = shuffleArray([...getStudyData()]);
            qzRestart();
        };

        // --- 4. WRITING VIEW ---
        let wrData = [];
        let wrIndex = 0;
        let wrInput = '';
        let wrStatus = 'typing'; // typing, correct, incorrect, revealed
        let wrHint = '';

        function renderWritingView(container) {
            let studyData = getStudyData();
            if (studyData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-500">
                        <i data-lucide="pen-tool" class="w-16 h-16 mb-4 text-slate-300"></i>
                        <p class="text-lg font-medium">Bạn chưa chọn từ vựng nào.</p>
                        <p class="text-sm mt-2">Vui lòng quay lại tab Danh sách để tích chọn từ luyện viết.</p>
                    </div>`;
                return;
            }

            if (wrData.length === 0 || wrData.length !== studyData.length) {
                wrData = shuffleArray([...studyData]);
                wrIndex = 0;
                wrInput = '';
                wrStatus = 'typing';
                wrHint = '';
            }

            if(wrIndex >= wrData.length) wrIndex = 0;
            const currentWord = wrData[wrIndex];

            // Input classes based on status
            let inputClasses = 'border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50';
            let iconHTML = '';
            
            if (wrStatus === 'correct') {
                inputClasses = 'border-green-500 bg-green-50 text-green-700';
                iconHTML = '<i data-lucide="check" class="w-6 h-6 text-green-600"></i>';
            } else if (wrStatus === 'incorrect') {
                inputClasses = 'border-red-400 bg-red-50 text-red-700 animate-shake';
                iconHTML = '<i data-lucide="x" class="w-6 h-6 text-red-600"></i>';
            } else if (wrStatus === 'revealed') {
                inputClasses = 'border-yellow-400 bg-yellow-50 text-yellow-700';
            }

            container.innerHTML = `
                <div class="max-w-xl mx-auto flex flex-col items-center">
                    <div class="w-full mb-6 flex justify-between items-center text-sm font-medium text-slate-500">
                        <span>Từ ${wrIndex + 1}/${wrData.length}</span>
                    </div>

                    <div class="w-full bg-white p-8 rounded-2xl shadow-lg border-b-4 border-indigo-100 mb-8 text-center relative overflow-hidden">
                        <span class="absolute top-4 right-4 text-xs font-bold text-slate-300 uppercase tracking-wider">${currentWord.type}</span>
                        <h3 class="text-slate-500 text-sm uppercase tracking-wider mb-2">Hãy viết từ tiếng Anh cho:</h3>
                        <h2 class="text-3xl font-bold text-indigo-700 mb-4">${currentWord.meaning}</h2>
                    </div>

                    <form onsubmit="wrCheckAnswer(event)" class="w-full relative">
                        <input
                            id="wr-input-field"
                            type="text"
                            value="${wrInput}"
                            oninput="wrInput = this.value"
                            placeholder="Nhập từ tiếng Anh..."
                            ${(wrStatus === 'correct' || wrStatus === 'revealed') ? 'disabled' : ''}
                            class="w-full p-4 pl-6 pr-14 text-xl rounded-xl border-2 outline-none transition-all shadow-sm ${inputClasses}"
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                        />
                        <div class="absolute right-4 top-1/2 -translate-y-1/2">
                            ${iconHTML}
                        </div>
                    </form>

                    <div class="mt-6 w-full flex flex-col items-center gap-4">
                        ${wrStatus === 'incorrect' ? `
                            <div class="w-full bg-red-50 border border-red-100 p-4 rounded-xl text-center">
                                <div class="text-red-600 font-bold mb-1 flex items-center justify-center gap-2">
                                    <i data-lucide="alert-circle" class="w-5 h-5"></i> Chưa chính xác!
                                </div>
                                <p class="text-slate-600 text-sm mb-2">Gợi ý sửa lỗi (hãy điền tiếp):</p>
                                <p class="font-mono text-2xl tracking-widest text-indigo-600 font-bold bg-white inline-block px-4 py-1 rounded border border-indigo-100">
                                    ${wrHint}
                                </p>
                            </div>
                        ` : ''}

                        ${wrStatus === 'correct' ? `
                            <div class="flex flex-col items-center">
                                <p class="text-green-600 font-bold text-lg mb-2">Chính xác!</p>
                                <p class="text-slate-500 italic mb-4">"${currentWord.example}"</p>
                                <button onclick="wrNextWord()" class="px-8 py-3 bg-indigo-600 text-white rounded-full font-bold shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all flex items-center gap-2">
                                    Tiếp tục <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ` : ''}

                        ${wrStatus === 'revealed' ? `
                            <div class="flex flex-col items-center">
                                <p class="text-yellow-600 font-medium mb-4">Đáp án là: <span class="font-bold">${currentWord.word}</span></p>
                                <button onclick="wrNextWord()" class="px-8 py-3 bg-indigo-600 text-white rounded-full font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2">
                                    Từ tiếp theo <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </button>
                            </div>
                        ` : ''}

                        ${(wrStatus === 'typing' || wrStatus === 'incorrect') ? `
                            <div class="flex gap-3 w-full">
                                <button type="button" onclick="wrGiveUp()" class="flex-1 py-3 text-slate-400 hover:text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">
                                    Không biết
                                </button>
                                <button onclick="wrCheckAnswer(event)" class="flex-[2] py-3 bg-indigo-600 text-white rounded-lg font-bold shadow-md hover:bg-indigo-700 transition-all active:scale-95">
                                    ${wrStatus === 'incorrect' ? 'Kiểm tra lại' : 'Kiểm tra'}
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            // Auto focus input if needed
            if (wrStatus === 'typing' || wrStatus === 'incorrect') {
                setTimeout(() => {
                    const input = document.getElementById('wr-input-field');
                    if (input) {
                        input.focus();
                        // Put cursor at end of input
                        const val = input.value;
                        input.value = '';
                        input.value = val;
                    }
                }, 0);
            }
        }

        window.wrCheckAnswer = (e) => {
            if(e) e.preventDefault();
            if (wrStatus !== 'typing' && wrStatus !== 'incorrect') return wrNextWord();

            const currentWord = wrData[wrIndex];
            const normalizedInput = wrInput.trim().toLowerCase();
            const normalizedTarget = currentWord.word.trim().toLowerCase();

            if (normalizedInput === normalizedTarget) {
                wrStatus = 'correct';
                wrHint = '';
                speak("Correct");
            } else {
                wrStatus = 'incorrect';
                speak("Try again");
                
                // Logic tạo gợi ý sửa lỗi
                let hint = '';
                let mismatchIndex = 0;
                while (mismatchIndex < normalizedInput.length && mismatchIndex < normalizedTarget.length && normalizedInput[mismatchIndex] === normalizedTarget[mismatchIndex]) {
                    hint += currentWord.word[mismatchIndex] + ' ';
                    mismatchIndex++;
                }

                if (mismatchIndex < normalizedTarget.length) {
                    hint += currentWord.word[mismatchIndex] + ' ';
                    const remainingLength = normalizedTarget.length - mismatchIndex - 1;
                    if (remainingLength > 0) {
                        hint += '_ '.repeat(remainingLength);
                    }
                }
                wrHint = hint.trim();
            }
            renderMainContent();
        };

        window.wrNextWord = () => {
            if (wrIndex < wrData.length - 1) {
                wrIndex++;
            } else {
                alert("Chúc mừng! Bạn đã hoàn thành vòng luyện viết.");
                wrIndex = 0;
                wrData = shuffleArray([...getStudyData()]);
            }
            wrInput = '';
            wrStatus = 'typing';
            wrHint = '';
            renderMainContent();
        };

        window.wrGiveUp = () => {
            const currentWord = wrData[wrIndex];
            wrStatus = 'revealed';
            speak(currentWord.word);
            wrInput = currentWord.word;
            wrHint = '';
            renderMainContent();
        };

        // --- GLOBAL KEYBOARD LISTENERS (For Flashcards) ---
        window.addEventListener('keydown', (e) => {
            if (activeTab === 'flashcard' && getStudyData().length > 0) {
                if (e.key === 'ArrowRight') fcNext();
                if (e.key === 'ArrowLeft') fcPrev();
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault(); // Prevent page scroll on space
                    fcToggleFlip();
                }
            }
        });

        // --- INITIALIZATION ---
        renderNav();
        renderMainContent();

    </script>
</body>
</html>
